<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Error</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-color: #f8d7da;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      width: 300px;
      text-align: center;
    }
    .error-message {
      color: red;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .redirect-message {
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Error</h2>
    <div class="error-message">Your credentials are invalid.</div>
    <div class="redirect-message">Redirecting you back to login...</div>
  </div>
  <script>
    setTimeout(function() {
      window.location.href = 'login.html';
    }, 3000); // Redirects to login.html after 3 seconds
  </script>
</body>
</html>
